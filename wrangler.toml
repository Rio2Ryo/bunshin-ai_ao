name = "bunshin-ai-api"
main = "worker/src/index.ts"
compatibility_date = "2026-02-15"

[vars]
NODE_ENV = "production"
# Secrets (set via `wrangler secret put`):
# AZURE_FOUNDRY_API_KEY, AZURE_FOUNDRY_RESOURCE,
# LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN,
# CLAWDBOT_AUTH_TOKEN, JWT_SECRET, STRIPE_SECRET_KEY

[[d1_databases]]
binding = "DB"
database_name = "bunshin-ai"
database_id = "2d1ebbfb-5c34-48be-a48e-bb0fac6c676d"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "bunshin-ai-assets"

# Durable Objects for WebSocket chat streaming and matching rooms
[durable_objects]
bindings = [
  { name = "CHAT_ROOMS", class_name = "ChatRoom" },
  { name = "MATCHING_ROOMS", class_name = "MatchingRoom" },
  { name = "WORKSPACE_ROOMS", class_name = "WorkspaceRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchingRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WorkspaceRoom"]

# Cron triggers for auto matching scheduler
[triggers]
crons = ["0 9 * * *", "0 9 * * 1"]
# Daily at 09:00 UTC (18:00 JST), Weekly Monday 09:00 UTC
