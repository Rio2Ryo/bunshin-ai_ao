<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オフライン - 分身AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
    }
    .container { text-align: center; padding: 2rem; max-width: 440px; }
    .icon {
      width: 120px; height: 120px; margin: 0 auto 2rem;
      background: rgba(99, 102, 241, 0.2); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 60px; height: 60px; stroke: #6366f1; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f1f5f9; }
    .status { font-size: 0.875rem; color: #94a3b8; margin-bottom: 1.5rem; }
    .status.online { color: #22c55e; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 2rem; }
    .retry-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem; background: #6366f1; color: white;
      border: none; border-radius: 0.5rem; font-size: 1rem;
      cursor: pointer; transition: background 0.2s;
    }
    .retry-btn:hover { background: #4f46e5; }
    .retry-btn:active { transform: scale(0.98); }
    .retry-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cached-links { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(148,163,184,0.2); }
    .cached-links h3 { font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.75rem; }
    .cached-links a {
      display: inline-block; margin: 0.25rem; padding: 0.5rem 1rem;
      background: rgba(99, 102, 241, 0.15); color: #a5b4fc;
      border-radius: 0.375rem; text-decoration: none; font-size: 0.875rem;
      transition: background 0.2s;
    }
    .cached-links a:hover { background: rgba(99, 102, 241, 0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0M12.53 18.22l-.53.53-.53-.53a.75.75 0 011.06 0z" />
      </svg>
    </div>
    <h1>オフラインです</h1>
    <p id="statusText" class="status">インターネット接続がありません</p>
    <p>接続が復旧すると自動的にリロードします。</p>
    <button class="retry-btn" id="retryBtn" onclick="tryReload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      再読み込み
    </button>
    <div class="cached-links">
      <h3>キャッシュされたページ</h3>
      <div id="cachedPages"></div>
    </div>
  </div>
  <script>
    // 接続復旧時に自動リロード
    window.addEventListener('online', () => {
      document.getElementById('statusText').textContent = '接続が復旧しました！リロードしています...';
      document.getElementById('statusText').className = 'status online';
      setTimeout(() => window.location.href = '/', 500);
    });

    function tryReload() {
      const btn = document.getElementById('retryBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 接続中...';
      fetch('/', { cache: 'no-store' })
        .then(() => { window.location.href = '/'; })
        .catch(() => {
          btn.disabled = false;
          btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg> 再読み込み';
        });
    }

    // キャッシュされたページを表示
    if ('caches' in window) {
      caches.open('bunshin-ai-v4').then(cache => cache.keys()).then(keys => {
        const container = document.getElementById('cachedPages');
        const pages = keys
          .filter(r => r.url.includes(location.origin) && !r.url.includes('/api/') && !r.url.includes('.'))
          .map(r => new URL(r.url).pathname)
          .filter(p => p !== '/offline.html');
        if (pages.length === 0) {
          container.innerHTML = '<span style="color:#64748b;font-size:0.8rem">キャッシュはまだありません</span>';
        } else {
          const names = { '/': 'ホーム', '/dashboard': 'ダッシュボード', '/chat': 'チャット', '/matching': 'マッチング', '/friends': '友達', '/profile': 'プロフィール' };
          container.innerHTML = pages.slice(0, 6).map(p =>
            '<a href="' + p + '">' + (names[p] || p) + '</a>'
          ).join('');
        }
      }).catch(() => {});
    }
  </script>
</body>
</html>
