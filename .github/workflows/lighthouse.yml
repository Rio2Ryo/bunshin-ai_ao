name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format Lighthouse score
        id: format_lighthouse_score
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf-8'));
            const summary = results.map(r => {
              const url = r.url;
              const report = JSON.parse(fs.readFileSync(r.jsonPath, 'utf-8'));
              const scores = {
                performance: Math.round(report.categories.performance.score * 100),
                accessibility: Math.round(report.categories.accessibility.score * 100),
                bestPractices: Math.round(report.categories['best-practices'].score * 100),
                seo: Math.round(report.categories.seo.score * 100),
                pwa: Math.round((report.categories.pwa?.score || 0) * 100),
              };
              const emoji = (s) => s >= 90 ? '🟢' : s >= 50 ? '🟡' : '🔴';
              return `| ${url} | ${emoji(scores.performance)} ${scores.performance} | ${emoji(scores.accessibility)} ${scores.accessibility} | ${emoji(scores.bestPractices)} ${scores.bestPractices} | ${emoji(scores.seo)} ${scores.seo} |`;
            }).join('\n');

            const body = `## ⚡ Lighthouse Report

            | URL | Performance | Accessibility | Best Practices | SEO |
            |-----|------------|---------------|----------------|-----|
            ${summary}

            _Lighthouse CI ran on ${new Date().toISOString().slice(0, 10)}_`;

            return body;

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse
          message: ${{ steps.format_lighthouse_score.outputs.result }}
